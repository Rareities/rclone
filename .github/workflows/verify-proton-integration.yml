name: Verify custom rclone Proton integration

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proton-and-bisync:
    if: github.repository == 'Rareities/rclone'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - name: Unit tests
        env:
          GOFLAGS: '-mod=readonly'
        run: go test ./backend/protondrive/... ./cmd/bisync/...
      - name: Contained Proton dependency safety fixtures
        env:
          GOFLAGS: '-mod=readonly'
        run: >-
          go test -race github.com/rclone/go-proton-api github.com/rclone/Proton-API-Bridge
          -run '^Test(Auth|ModernName|MixedLegacyModern|DraftReplacement|NameFixtures|EncryptMessageNonAead|SetEncXAttrStringNonAead|SetNameNonAead)'
      - name: Build CLI
        env:
          GOFLAGS: '-mod=readonly'
        run: go build .
