name: Verify custom rclone Proton integration

on:
  push:
    branches: [master]
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proton-and-bisync:
    if: github.repository == 'Rareities/rclone'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Unit tests
        env:
          GOFLAGS: '-mod=readonly'
        run: go test ./backend/protondrive/... ./cmd/bisync/...
      - name: Build CLI
        env:
          GOFLAGS: '-mod=readonly'
        run: go build .
