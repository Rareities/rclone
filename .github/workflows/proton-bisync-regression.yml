name: Proton and bisync regression
on:
  pull_request:
    paths:
      - 'backend/protondrive/**'
      - 'backend/internxt/**'
      - 'cmd/bisync/**'
      - 'third_party/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/verify-bisync-integration.ps1'
      - '.github/workflows/proton-bisync-regression.yml'
  push:
    branches:
      - 'feat/proton-bisync*'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - name: Backend and bisync scenarios
        run: go test ./backend/protondrive ./backend/internxt ./cmd/bisync/... -count=1
      - name: Companion module local tests
        run: go test github.com/rclone/Proton-API-Bridge github.com/rclone/Proton-API-Bridge/common github.com/rclone/go-proton-api -run 'TestAuthenticatedName|TestAuth.*Refresh|TestLogin.*Refresh|Test.*Block|TestRequireActiveFolder|TestDistinctDirectoryNames|TestFileDownloadReader' -count=1
      - name: Concurrent ownership and metadata checks
        run: go test -race ./backend/protondrive ./cmd/bisync -run 'TestSession|TestRequireChecksum|TestLockfile' -count=1
      - name: Static checks
        run: go vet ./backend/protondrive ./backend/internxt ./cmd/bisync
      - name: Build isolated CLI
        run: go build -mod=readonly -tags noselfupdate -o "$RUNNER_TEMP/rclone-acceptance" .
      - name: Real subprocess bisync acceptance
        shell: pwsh
        run: ./scripts/verify-bisync-integration.ps1 -Rclone "$env:RUNNER_TEMP/rclone-acceptance" -WorkRoot "$env:RUNNER_TEMP/bisync-acceptance"
      - name: Upload local-only acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bisync-cli-evidence
          path: |
            ${{ runner.temp }}/bisync-acceptance/**/*.log
            ${{ runner.temp }}/bisync-acceptance/*.json
          if-no-files-found: ignore
          retention-days: 14
