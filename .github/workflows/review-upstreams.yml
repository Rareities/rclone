name: Review official rclone and OSS Proton patches

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Upstream source
        type: choice
        options: [both, official, oss]
        default: both

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dual-upstream-review
  cancel-in-progress: false

jobs:
  official:
    if: github.event_name == 'schedule' || inputs.source == 'both' || inputs.source == 'official'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare candidate without write credentials
        id: prepare
        run: bash .github/scripts/review-upstreams.sh official
      - uses: actions/setup-go@v6
        if: steps.prepare.outputs.changed == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Test selected source
        if: steps.prepare.outputs.changed == 'true'
        env:
          GOFLAGS: -mod=readonly
        run: |
          go test ./backend/protondrive/... ./cmd/bisync/...
          go build .
      - name: Open or update draft PR
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" fetch origin +refs/heads/automation/review-official-rclone:refs/remotes/origin/automation/review-official-rclone || true
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --force-with-lease origin HEAD:refs/heads/automation/review-official-rclone
          existing="$(gh pr list --head automation/review-official-rclone --base master --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create --draft --base master --head automation/review-official-rclone --title 'chore: review official rclone master' --body-file /tmp/upstream-pr.md
          else
            gh pr edit "$existing" --body-file /tmp/upstream-pr.md
          fi
  oss:
    if: github.event_name == 'schedule' || inputs.source == 'both' || inputs.source == 'oss'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare Forgejo Proton candidate without write credentials
        id: prepare
        run: bash .github/scripts/review-upstreams.sh oss
      - uses: actions/setup-go@v6
        if: steps.prepare.outputs.changed == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: Test selected source
        if: steps.prepare.outputs.changed == 'true'
        env:
          GOFLAGS: -mod=readonly
        run: |
          go test ./backend/protondrive/... ./cmd/bisync/...
          go build .
      - name: Open or update draft PR
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" fetch origin +refs/heads/automation/review-oss-protondrive:refs/remotes/origin/automation/review-oss-protondrive || true
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --force-with-lease origin HEAD:refs/heads/automation/review-oss-protondrive
          existing="$(gh pr list --head automation/review-oss-protondrive --base master --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create --draft --base master --head automation/review-oss-protondrive --title 'chore: review OSS Proton Drive fixes' --body-file /tmp/upstream-pr.md
          else
            gh pr edit "$existing" --body-file /tmp/upstream-pr.md
          fi
